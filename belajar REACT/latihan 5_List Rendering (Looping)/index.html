<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 5 - Looping</title>
</head>
<body>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById("app"));

        const dataHP = [
            { id: 1, name: "iPhone X", price: 10000000 },
            { id: 2, name: "Samsung S23", price: 15000000 },
            { id: 3, name: "Xiaomi 13", price: 9000000 }
        ];

        function App() {
            return (
                <div>
                    <h1>List Handphone (Looping)</h1>
                    <ul>
                        {dataHP.map((hp) => (
                            <li key={hp.id}>
                                <b>{hp.name}</b> - Rp {hp.price}
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        root.render(<App />);
    </script>
</body>
</html>
