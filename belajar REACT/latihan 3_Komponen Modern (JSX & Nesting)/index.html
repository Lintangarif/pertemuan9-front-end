<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 3 - React Modern</title>
</head>
<body>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById("app"));

        // Komponen Anak
        function Header() {
            return <h1 style={{color: 'blue'}}>Judul</h1>;
        }

        // Komponen Anak
        function Content() {
            return <p>Ini adalah konten yang disusun (Nesting) di dalam App.</p>;
        }

        // Komponen Induk (App)
        function App() {
            return (
                <div style={{border: '1px solid black', padding: '10px'}}>
                    <Header />
                    <hr />
                    <Content />
                </div>
            );
        }

        root.render(<App />);
    </script>
</body>
</html>
